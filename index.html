<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوت‌نامه عروسی | محمد سجاد و زهرا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'B Nazanin','Tahoma','Arial',sans-serif}

body{
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  margin:0;
  padding:0;
}

.container{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.envelope{
  position:relative;
  width:300px;
  height:200px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  cursor:pointer;
  transform-style:preserve-3d;
  transition:all 0.6s ease;
  margin:0 auto;
}

.envelope.opened{
  animation:openEnvelope 1s ease forwards;
}

@keyframes openEnvelope{
  0%{transform:rotateX(0deg);}
  50%{transform:rotateX(-15deg);}
  100%{transform:rotateX(-180deg);opacity:0;pointer-events:none;}
}

.envelope-front{
  position:absolute;
  width:100%;
  height:100%;
  background:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
  border:3px solid #ddd;
  overflow:hidden;
}

.envelope-front::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:50%;
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  z-index:5;
}

.envelope-text{
  position:relative;
  z-index:6;
  text-align:center;
  color:#fff;
  text-shadow:2px 2px 4px rgba(0,0,0,0.2);
}

.envelope-text h2{
  margin:0;
  font-size:24px;
  font-weight:bold;
}

.envelope-text p{
  margin:5px 0 0 0;
  font-size:14px;
  opacity:0.9;
}

.envelope-icon{
  position:absolute;
  bottom:30px;
  font-size:40px;
  animation:bounce 2s infinite;
  z-index:6;
}

@keyframes bounce{
  0%, 100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.invitation{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.6s ease;
}

.invitation.show{
  opacity:1;
  pointer-events:all;
}

.invitation-content{
  position:relative;
  width:90%;
  max-width:600px;
  max-height:90vh;
  background:#fff;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  overflow:auto;
  animation:slideUp 0.8s ease;
}

@keyframes slideUp{
  from{transform:translateY(50px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.invitation img{
  width:100%;
  height:auto;
  display:block;
  border-radius:15px;
}

.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(255,255,255,0.9);
  border:none;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:28px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s ease;
  z-index:10;
}

.close-btn:hover{
  background:#fff;
  transform:scale(1.1);
}

@media (max-width:768px){
  .envelope{width:250px;height:170px;}
  .envelope-text h2{font-size:18px;}
  .envelope-text p{font-size:12px;}
  .envelope-icon{font-size:30px;}
  .invitation-content{width:95%;max-height:95vh;}
}

@media (max-width:480px){
  .envelope{width:220px;height:150px;}
  .envelope-text h2{font-size:16px;}
  .envelope-text p{font-size:11px;}
  .envelope-icon{font-size:25px;}
  .close-btn{width:35px;height:35px;font-size:24px;}
}
</style>
</head>
<body>
  <div class="container">
    <div class="envelope" id="envelope">
      <div class="envelope-front">
        <div class="envelope-text">
          <h2>🎊 دعوتنامه عروسی</h2>
          <p>محمد سجاد و زهرا</p>
        </div>
        <div class="envelope-icon">💌</div>
      </div>
    </div>
  </div>

  <div class="invitation" id="invitation">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="invitation-content">
      <img src="https://github.com/Mamad73x2x/Sajad-zahra/raw/main/file_0000000060f08210b4ca0169d9e337b8.png" alt="دعوت‌نامه عروسی">
    </div>
  </div>

  <audio id="weddingMusic" loop>
    <source src="https://dl.mehrdl.top/Music/A/D/LeilaFroohar/Leila%20Forouhar%20-%20Aroosi.mp3" type="audio/mpeg">
  </audio>

  <script>
    const envelope = document.getElementById('envelope');
    const invitation = document.getElementById('invitation');
    const closeBtn = document.getElementById('closeBtn');
    const weddingMusic = document.getElementById('weddingMusic');
    let isPlaying = false;

    weddingMusic.volume = 0.5;

    envelope.addEventListener('click', function() {
      this.classList.add('opened');
      setTimeout(() => {
        invitation.classList.add('show');
        weddingMusic.play().catch(err => console.log('خطا:', err));
        isPlaying = true;
      }, 300);
    });

    closeBtn.addEventListener('click', function() {
      invitation.classList.remove('show');
      setTimeout(() => {
        envelope.classList.remove('opened');
        weddingMusic.pause();
        weddingMusic.currentTime = 0;
        isPlaying = false;
      }, 600);
    });

    invitation.addEventListener('click', function(e) {
      if(e.target === this) closeBtn.click();
    });
  </script>
</body>
</html>
